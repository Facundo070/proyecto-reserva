version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ies6001-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ies6001_recursos
      MYSQL_USER: user_ies
      MYSQL_PASSWORD: user_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: .
    container_name: ies6001-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://user_ies:user_password@db:3306/ies6001_recursos"
      JWT_SECRET: "clave_secreta_super_segura_ies6001"
    depends_on:
      - db

volumes:
  mysql_data: